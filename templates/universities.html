{% extends "base.html" %}
{% block content %}

<h1 class="text-3xl font-bold text-blue-700 mb-2">🏫 Universities</h1>
<p class="text-gray-500 mb-8">All universities currently tracked by AdmitBD</p>

<div class="flex flex-col gap-5">
    {% for uni in universities %}
    <a href="/university/{{ uni.id }}" class="bg-white rounded-xl shadow p-6 hover:shadow-md transition block">
        <div class="flex justify-between items-start">
            <div>
                <h2 class="text-lg font-semibold text-blue-700">{{ uni.name }}</h2>
                <p class="text-sm text-gray-400 mt-1">📍 {{ uni.location }}</p>
                <p class="text-xs text-blue-400 mt-1">{{ uni.website }}</p>
            </div>
            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">
                {{ uni.short_name }}
            </span>
        </div>
        <div class="mt-3 text-sm text-blue-600 font-medium">View details →</div>
    </a>
    {% endfor %}
</div>

{% endblock %}
