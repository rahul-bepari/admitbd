{% extends "base.html" %}
{% block content %}

<h1 class="text-3xl font-bold text-blue-700 mb-2">🤖 AI Advisor</h1>
<p class="text-gray-500 mb-8">Ask anything about university admissions in Bangladesh</p>

<!-- Input -->
<div class="bg-white rounded-xl shadow p-6 mb-6">
    <form method="POST">
        <label class="block text-sm font-medium text-gray-600 mb-2">Your Question</label>
        <textarea name="question" rows="3"
            placeholder="e.g. Which universities can I apply to with SSC 4.5 and HSC 4.0?"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">{{ question or '' }}</textarea>
        <button type="submit"
            class="mt-3 bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-800 transition">
            Ask AI →
        </button>
    </form>
</div>

<!-- Answer -->
{% if answer %}
<div class="bg-white rounded-xl shadow p-6">
    <h2 class="text-sm font-semibold text-gray-400 mb-3">🤖 AdmitBD Advisor says:</h2>
    <p class="text-gray-700 leading-relaxed whitespace-pre-line">{{ answer | replace('**', '') }}</p>
</div>
{% endif %}

{% endblock %}
