<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdmitBD — Bangladesh University Admissions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Hidden SVG Glass Filter -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="glass-filter" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
                <feGaussianBlur in="displaced" stdDeviation="0.4" result="blurred"/>
                <feBlend in="SourceGraphic" in2="blurred" mode="normal" result="output"/>
            </filter>
        </defs>
    </svg>

    <!-- Floating Pill Navbar -->
    <div class="sticky top-4 z-50 flex justify-center px-4 mb-4">
        <nav class="relative flex items-center gap-1 px-3 py-2 rounded-full shadow-2xl overflow-hidden"
            style="
                background: rgba(20, 20, 35, 0.55);
                backdrop-filter: blur(24px) saturate(180%);
                -webkit-backdrop-filter: blur(24px) saturate(180%);
                border: 1px solid rgba(255,255,255,0.18);
                box-shadow: 
                    rgba(255,255,255,0.15) 0px 0px 0px 0.5px inset,
                    rgba(0,0,0,0.3) 0px 8px 32px,
                    rgba(0,0,0,0.2) 0px 2px 8px;
            ">

            <!-- Inner shine effect -->
            <div class="absolute inset-0 rounded-full pointer-events-none"
                style="background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%, rgba(255,255,255,0.04) 100%);">
            </div>

            <!-- Logo -->
            <a href="/" class="relative flex items-center gap-1.5 text-white font-bold text-sm px-3 py-1.5 rounded-full mr-1 z-10"
                style="background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15);">
                🎓 <span>AdmitBD</span>
            </a>

            <!-- Links -->
            <a href="/" class="relative z-10 text-white text-opacity-80 hover:text-white text-xs font-medium px-3 py-1.5 rounded-full transition-all hover:bg-white hover:bg-opacity-10"
                style="color: rgba(255,255,255,0.8);">
                Home
            </a>
            <a href="/universities" class="relative z-10 text-xs font-medium px-3 py-1.5 rounded-full transition-all hover:bg-white hover:bg-opacity-10"
                style="color: rgba(255,255,255,0.8);">
                Universities
            </a>
            <a href="/checker" class="relative z-10 text-xs font-medium px-3 py-1.5 rounded-full transition-all hover:bg-white hover:bg-opacity-10"
                style="color: rgba(255,255,255,0.8);">
                Eligibility
            </a>
            <a href="/deadlines" class="relative z-10 text-xs font-medium px-3 py-1.5 rounded-full transition-all hover:bg-white hover:bg-opacity-10"
                style="color: rgba(255,255,255,0.8);">
                Deadlines
            </a>
            <a href="/advisor" class="relative z-10 text-xs font-medium px-3 py-1.5 rounded-full transition-all"
                style="background: linear-gradient(135deg, #7c3aed, #3b82f6); color: white; border: 1px solid rgba(255,255,255,0.2);">
                 AI Advisor
            </a>
        </nav>
    </div>

    <!-- Page Content -->
    <main class="max-w-5xl mx-auto px-4 pb-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-400 text-sm py-6 mt-10 border-t">
        © 2025 AdmitBD — Built for Bangladesh students
    </footer>

</body>
</html>
