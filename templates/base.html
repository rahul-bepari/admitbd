<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdmitBD — Bangladesh University Admissions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Floating Pill Navbar -->
    <div class="sticky top-4 z-50 flex justify-center px-4 mb-4">
        <nav class="flex items-center gap-1 px-4 py-2 rounded-full shadow-2xl"
            style="background: rgba(15,15,25,0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12);">
            
            <!-- Logo -->
            <a href="/" class="text-white font-bold text-sm px-3 py-1.5 rounded-full mr-2 flex items-center gap-1.5"
                style="background: rgba(255,255,255,0.1);">
                🎓 <span>AdmitBD</span>
            </a>

            <!-- Links -->
            <a href="/" class="text-gray-300 hover:text-white hover:bg-white hover:bg-opacity-10 text-xs font-medium px-3 py-1.5 rounded-full transition">
                Home
            </a>
            <a href="/universities" class="text-gray-300 hover:text-white hover:bg-white hover:bg-opacity-10 text-xs font-medium px-3 py-1.5 rounded-full transition">
                Universities
            </a>
            <a href="/checker" class="text-gray-300 hover:text-white hover:bg-white hover:bg-opacity-10 text-xs font-medium px-3 py-1.5 rounded-full transition">
                Eligibility
            </a>
            <a href="/deadlines" class="text-gray-300 hover:text-white hover:bg-white hover:bg-opacity-10 text-xs font-medium px-3 py-1.5 rounded-full transition">
                Deadlines
            </a>
            <a href="/advisor" class="text-gray-300 hover:text-white text-xs font-medium px-3 py-1.5 rounded-full transition"
                style="background: linear-gradient(135deg, #7c3aed, #3b82f6);">
                🤖 AI Advisor
            </a>
        </nav>
    </div>

    <!-- Page Content -->
    <main class="max-w-5xl mx-auto px-4 pb-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-400 text-sm py-6 mt-10 border-t">
        © 2025 AdmitBD — Built for Bangladesh students
    </footer>

</body>
</html>
