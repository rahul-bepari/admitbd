<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdmitBD — Bangladesh University Admissions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Glassy Navbar -->
    <nav class="sticky top-0 z-50 px-6 py-3 flex justify-between items-center"
        style="background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0,0,0,0.08);">
        <a href="/" class="text-xl font-bold tracking-wide text-blue-700">🎓 AdmitBD</a>
        <div class="flex gap-6 text-sm font-medium">
            <a href="/" class="text-gray-700 hover:text-blue-600 transition">Home</a>
            <a href="/universities" class="text-gray-700 hover:text-blue-600 transition">Universities</a>
            <a href="/checker" class="text-gray-700 hover:text-blue-600 transition">Eligibility Checker</a>
            <a href="/deadlines" class="text-gray-700 hover:text-blue-600 transition">Deadlines</a>
            <a href="/advisor" class="text-gray-700 hover:text-blue-600 transition">AI Advisor</a>
        </div>
    </nav>

    <!-- Page Content -->
    <main class="max-w-5xl mx-auto px-4 py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-400 text-sm py-6 mt-10 border-t">
        © 2025 AdmitBD — Built for Bangladesh students
    </footer>

</body>
</html>
